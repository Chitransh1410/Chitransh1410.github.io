<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mishu's Birthday Countdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: sunny party column — floating balloons behind, bright candles, candy-coloured clock tiles, polaroid notes */
:root{
  --sky:#fff1f6;
  --sky-2:#ffe0ec;
  --berry:#8a1d4f;
  --ink:#4a1630;
  --muted:#a0577a;
  --pink:#ff5fa2;
  --sun:#ffc93c;
  --mint:#4fd1b5;
  --sea:#5aa9ff;
  --lilac:#b48cff;
  --paper:#ffffff;
  --display:"Fredoka", "Trebuchet MS", sans-serif;
  --body:"Nunito", system-ui, sans-serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
  color-scheme:light;
}
html,body{margin:0;background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;min-height:100%;overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,201,60,.35) 0 90px, transparent 91px),
    radial-gradient(circle at 92% 8%, rgba(90,169,255,.25) 0 70px, transparent 71px),
    radial-gradient(circle at 85% 60%, rgba(79,209,181,.22) 0 110px, transparent 111px),
    radial-gradient(circle at 6% 80%, rgba(180,140,255,.25) 0 100px, transparent 101px),
    linear-gradient(180deg, var(--sky-2), var(--sky) 45%);
  background-attachment:fixed}
.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.balloon{position:absolute;bottom:-140px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear infinite}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(74,22,48,.25)}
@keyframes rise{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-60vh) translateX(18px)}100%{transform:translateY(-130vh) translateX(-10px)}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:36px 64px;display:flex;flex-direction:column;gap:34px}
header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.eyebrow{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);background:var(--pink);padding:5px 12px;border-radius:999px;transform:rotate(-2deg)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1;margin:6px 0 0;text-wrap:balance;color:var(--berry)}
h1 em{font-style:normal;color:var(--pink);display:inline-block;animation:bob 2.4s ease-in-out infinite}
.full{font-family:var(--hand);font-size:1.7rem;color:var(--berry)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

.candles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;justify-items:center;padding:18px 10px 12px;background:var(--paper);border-radius:22px;box-shadow:0 14px 30px -18px rgba(138,29,79,.45)}
.candle{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.flame{width:18px;height:28px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%, #fff6c9 0 25%, var(--sun) 55%, #ff8a3c 72%, transparent 76%);
  box-shadow:0 0 18px 6px rgba(255,201,60,.55);transform-origin:50% 100%;animation:flicker 1.4s ease-in-out infinite alternate}
.candle:not(.lit) .flame{opacity:0;box-shadow:none;animation:none}
.wick{width:2px;height:8px;background:var(--ink);margin-top:-8px}
.stick{width:24px;border-radius:6px 6px 3px 3px}
.candle:nth-child(1) .stick{height:64px;background:repeating-linear-gradient(135deg,#fff 0 7px,var(--sea) 7px 13px)}
.candle:nth-child(2) .stick{height:78px;background:repeating-linear-gradient(135deg,#fff 0 7px,var(--mint) 7px 13px)}
.candle:nth-child(3) .stick{height:92px;background:repeating-linear-gradient(135deg,#fff 0 7px,var(--lilac) 7px 13px)}
.candle:nth-child(4) .stick{height:106px;background:repeating-linear-gradient(135deg,#fff 0 7px,var(--pink) 7px 13px)}
.candle:not(.lit) .stick{filter:grayscale(.75) opacity(.55)}
.clabel{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.candle.today .clabel{color:var(--paper);background:var(--pink);padding:1px 8px;border-radius:999px}
@keyframes flicker{0%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1,.92) rotate(3deg)}100%{transform:scale(.94,1.06) rotate(-1deg)}}

.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.unit{border-radius:18px;padding:14px 4px;color:var(--paper);box-shadow:0 10px 0 -4px rgba(74,22,48,.15)}
.unit:nth-child(1){background:var(--pink);transform:rotate(-2deg)}
.unit:nth-child(2){background:var(--sun);color:var(--ink);transform:rotate(1.5deg)}
.unit:nth-child(3){background:var(--mint);color:var(--ink);transform:rotate(-1deg)}
.unit:nth-child(4){background:var(--sea);transform:rotate(2deg)}
.num{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,8.5vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1}
.ulab{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;opacity:.9}
.clock-cap{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:-18px}

.notes{display:flex;flex-direction:column;gap:16px}
.note{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start;padding:18px;border-radius:22px;background:rgba(255,255,255,.6);border:2px dashed rgba(160,87,122,.35)}
.note > div{min-width:0}
.note.open{background:var(--paper);border:2px solid transparent;box-shadow:0 14px 30px -18px rgba(138,29,79,.45)}
.note.current{border-color:var(--pink)}
.date{text-align:center;display:flex;flex-direction:column;background:var(--sun);border-radius:16px;padding:8px 0;color:var(--ink)}
.note:nth-child(2) .date{background:var(--mint)}
.note:nth-child(3) .date{background:var(--lilac);color:var(--paper)}
.note:nth-child(4) .date{background:var(--pink);color:var(--paper)}
.note.locked .date{background:var(--sky-2);color:var(--muted)}
.date b{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1}
.date span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.ntitle{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 4px;color:var(--berry)}
.nbody{font-family:var(--hand);font-size:1.5rem;line-height:1.25;margin:0;color:var(--ink)}
.note.locked .nbody{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.note.locked .ntitle{color:var(--muted);font-size:1.05rem}
.note.locked .ntitle::before{content:"🔒 "}
.note.bday .ntitle{color:var(--pink);font-size:1.5rem}
.photo{margin:14px 0 0;padding:8px 8px 12px;background:var(--paper);border-radius:6px;transform:rotate(-2deg);box-shadow:0 12px 26px -10px rgba(74,22,48,.45);max-width:300px;border:1px solid rgba(74,22,48,.08)}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.note:nth-child(even) .photo{transform:rotate(2deg)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.strip .photo{margin:0;padding:5px 5px 8px;max-width:none}
.strip .photo:nth-child(2){transform:rotate(3deg) translateY(6px)}
.party{display:none;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--pink);animation:bob 2.4s ease-in-out infinite}
body.is-bday .party{display:block}
body.is-bday .clock, body.is-bday .clock-cap{display:none}
canvas#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
.pop{position:fixed;pointer-events:none;font-size:22px;z-index:6;animation:pop 1.1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),-120px) scale(1.4) rotate(var(--r));opacity:0}}
.tip{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:-20px}
footer{text-align:center;color:var(--muted);font-size:14px;font-weight:600}
footer .sig{font-family:var(--hand);font-size:1.7rem;color:var(--berry)}
@media (prefers-reduced-motion:reduce){.flame,.balloon,h1 em,.party{animation:none}.balloon{display:none}}
@media (max-width:420px){.note{grid-template-columns:52px 1fr;padding:14px;gap:12px}}
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="balloons" id="balloons" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">6 November · Birthday countdown 🎈</div>
    <h1>Almost time, <em>Mishu!</em></h1>
    <div class="full">for my Amisha ❤️</div>
  </header>

  <div class="candles" id="candles" aria-label="One candle lights for each day">
    <div class="candle" data-d="3"><div class="flame"></div><div class="wick"></div><div class="stick"></div><div class="clabel">3 Nov</div></div>
    <div class="candle" data-d="4"><div class="flame"></div><div class="wick"></div><div class="stick"></div><div class="clabel">4 Nov</div></div>
    <div class="candle" data-d="5"><div class="flame"></div><div class="wick"></div><div class="stick"></div><div class="clabel">5 Nov</div></div>
    <div class="candle" data-d="6"><div class="flame"></div><div class="wick"></div><div class="stick"></div><div class="clabel">6 Nov</div></div>
  </div>

  <div class="party">Happy Birthday, Mishu! 🎂🎉</div>
  <div class="clock" role="timer" aria-live="off">
    <div class="unit"><div class="num" id="d">0</div><div class="ulab">Days</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="ulab">Hours</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="ulab">Minutes</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="ulab">Seconds</div></div>
  </div>
  <div class="clock-cap">until your birthday begins 🎉</div>
  <div class="tip">Tap anywhere for a little surprise 💖</div>

  <section class="notes" id="notes"></section>

  <footer>
    <div>Come back each day, a new note opens.</div>
    <div class="sig">— Yours, Chitransh</div>
  </footer>
</div>

  var notes = [
    {d:3, img:0, title:"3 days to go", body:"Three days to go, my love. Since 2022 you have been my favourite person, from those commerce college days till today. Pune and Dubai might be far apart, but you are still the first thing I think about every morning."},
    {d:4, img:1, title:"2 days to go", body:"Remember Dehradun? PGDM by day and our own little home by night. Those days taught me that home was never a place. It was always you."},
    {d:5, img:2, title:"Tomorrow!", body:"Long distance is hard, Mishu, but you make it worth every missed call and every late-night video call. One more sleep. I wish I could be the first to say it in person, so at midnight this page will say it for me."},
    {d:6, title:"Happy Birthday, Mishu! ❤️", body:"Happy birthday, my love. From a commerce classroom to Dehradun, and now Pune to Dubai, you have been my constant through everything. Thank you for choosing us every single day. I am so proud of you and so lucky to have you. This distance is only for now. I love you, Amsiha.", bday:true}
  ];
  var MON = "Nov";
  var box = document.getElementById("notes");

  function dayNum(now){
    if (now.getFullYear()!==YEAR || now.getMonth()!==MONTH) return now < new Date(YEAR,MONTH,1) ? 0 : 99;
    return now.getDate();
  }

  function fig(i){ return '<figure class="photo"><img src="'+P[i]+'" alt="Mishu"></figure>'; }
  function pics(n){
    if (n.bday) return '<div class="strip">'+fig(0)+fig(1)+fig(2)+'</div>';
    return fig(n.img);
  }
  function render(){
    var today = dayNum(new Date());
    box.innerHTML = "";
    notes.forEach(function(n){
      var open = today >= n.d;
      var el = document.createElement("article");
      el.className = "note " + (open ? "open" : "locked") + (today===n.d ? " current" : "") + (n.bday ? " bday" : "");
      el.innerHTML =
        '<div class="date"><b>'+n.d+'</b><span>'+MON+'</span></div>' +
        '<div><p class="ntitle">'+(open ? n.title : "Opens on "+n.d+" "+MON)+'</p>' +
        '<p class="nbody">'+(open ? n.body : "This note is still sealed. Check back that day.")+'</p>' + (open ? pics(n) : '') + '</div>';
      box.appendChild(el);
    });
    document.querySelectorAll(".candle").forEach(function(c){
      var d = +c.dataset.d;
      c.classList.toggle("lit", today >= d);
      c.classList.toggle("today", today === d);
    });
    var isBday = new Date() >= target;
    if (isBday && !document.body.classList.contains("is-bday")) { document.body.classList.add("is-bday"); confetti(); }
  }

  function pad(n){return n<10?"0"+n:""+n}
  var lastDay = null;
  function tick(){
    var now = new Date(), diff = Math.max(0, target - now);
    var s = Math.floor(diff/1000);
    document.getElementById("d").textContent = Math.floor(s/86400);
    document.getElementById("h").textContent = pad(Math.floor(s%86400/3600));
    document.getElementById("m").textContent = pad(Math.floor(s%3600/60));
    document.getElementById("s").textContent = pad(s%60);
    var dn = now.toDateString();
    if (dn !== lastDay){ lastDay = dn; render(); }
  }
  tick(); setInterval(tick, 1000);

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bcols = ["#ff5fa2","#ffc93c","#4fd1b5","#5aa9ff","#b48cff","#ff8a3c"];
  var bl = document.getElementById("balloons");
  for (var i=0;i<9;i++){ var b=document.createElement("div"); b.className="balloon";
    b.style.left=(5+Math.random()*90)+"%"; b.style.background=bcols[i%bcols.length];
    b.style.animationDuration=(14+Math.random()*12)+"s"; b.style.animationDelay=(-Math.random()*20)+"s";
    var sc=.6+Math.random()*.7; b.style.width=(46*sc)+"px"; b.style.height=(58*sc)+"px"; bl.appendChild(b); }
  var emo=["💖","💕","🎉","✨","🌸","🎈","💗"];
  document.addEventListener("click",function(e){
    if (reduce) return;
    for (var k=0;k<7;k++){ var p=document.createElement("span"); p.className="pop";
      p.textContent=emo[Math.floor(Math.random()*emo.length)];
      p.style.left=(e.clientX-11)+"px"; p.style.top=(e.clientY-11)+"px";
      p.style.setProperty("--dx",(Math.random()*160-80)+"px"); p.style.setProperty("--r",(Math.random()*90-45)+"deg");
      document.body.appendChild(p); setTimeout(function(n){return function(){n.remove()}}(p),1200); }
  });
  function confetti(){
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    function size(){cv.width = innerWidth; cv.height = innerHeight}
    size(); addEventListener("resize", size);
    var cols = ["#ff5fa2","#ffc93c","#4fd1b5","#5aa9ff","#b48cff"];
    var bits = [];
    for (var i=0;i<160;i++) bits.push({x:Math.random()*cv.width, y:-Math.random()*cv.height, r:4+Math.random()*5,
      vy:1.2+Math.random()*2.2, vx:-1+Math.random()*2, a:Math.random()*6, c:cols[i%cols.length]});
    var t0 = performance.now();
    (function loop(t){
      ctx.clearRect(0,0,cv.width,cv.height);
      bits.forEach(function(b){
        b.y+=b.vy; b.x+=b.vx+Math.sin(b.a+=.05)*.6;
        if (b.y>cv.height+10 && t-t0<9000){ b.y=-10; b.x=Math.random()*cv.width; }
        ctx.fillStyle=b.c; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a); ctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2); ctx.restore();
      });
      if (t-t0<14000) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
    })(t0);
  }
})();
